name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Opt into Node.js 24 for JavaScript actions ahead of the June 2026 default
# switch (Node 20 is deprecated on GitHub runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the module's Go floor rather than `stable`: the pinned
      # golangci-lint cannot typecheck the Go 1.27 standard library yet, and
      # the newer releases re-scope `exhaustruct` to `exhaustruct_v5`
      # (50 new findings) with no equivalent `include` filter. Bump Go and
      # the linter together once that config migration is done.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need formatting:" && echo "$unformatted" && exit 1
          fi

      - name: go vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Tests (race detector)
        run: make test

      - name: Coverage
        run: make coverage

      - name: Build
        run: make build
